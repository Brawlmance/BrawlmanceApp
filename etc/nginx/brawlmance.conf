server {
    listen 80;
    listen 443 ssl;
    server_name brawlmance.com;
    ssl_certificate     ssl_balbona/cert.pem;
    ssl_certificate_key ssl_balbona/key.pem;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    location / {
        proxy_pass http://localhost:4400;
    }
    location /api {
        rewrite    /api/(.*$) /$1 break;
        proxy_pass http://localhost:4401;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.brawlmance.com;
    ssl_certificate     ssl_balbona/cert.pem;
    ssl_certificate_key ssl_balbona/key.pem;
    return 301 https://brawlmance.com$request_uri;
}
